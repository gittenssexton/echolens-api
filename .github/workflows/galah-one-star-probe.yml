name: Research GALAH DR4 one-star endpoint probe
on:
  push:
    branches: [research/f01-selection-bias-20261011]
    paths: [.github/workflows/galah-one-star-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test bounded single-star endpoints
        run: python -m scripts.galah_endpoint_probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: galah-dr4-single-star-endpoint-probe
          path: galah_probe/
          retention-days: 30
          if-no-files-found: warn
