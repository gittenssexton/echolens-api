name: Research GALAH DR4 two-star bounded FITS HDU audit
on:
  push:
    branches: [research/f01-selection-bias-20261011]
    paths: [.github/workflows/galah-fits-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install astropy==7.2.0
      - run: python -m scripts.galah_two_star_fits_audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: galah-dr4-two-star-fits-audit-20261011
          path: galah_dr4_audit/
          retention-days: 30
          if-no-files-found: warn
