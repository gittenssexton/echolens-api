name: Research GALAH DR4 native per-exposure camera FITS
on:
  push:
    branches: [research/f01-selection-bias-20261011]
    paths: [.github/workflows/galah-native-exposures.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install astropy==7.2.0
      - run: python -m scripts.galah_native_original_exposures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: galah-dr4-original-two-star-subexposure-fits-20261011
          path: galah_originals/
          retention-days: 30
          if-no-files-found: warn
