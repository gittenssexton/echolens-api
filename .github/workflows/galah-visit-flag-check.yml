name: Research GALAH clean dwarf per-visit flag check
on:
  push:
    branches: [research/f01-selection-bias-20261011]
    paths: [.github/workflows/galah-visit-flag-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m scripts.galah_visit_flag_check
      - uses: actions/upload-artifact@v4
        with:
          name: galah-dwarf-candidate-flags
          path: galah_candidate_flags/
          retention-days: 30
