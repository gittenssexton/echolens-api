name: Explicit LAMOST LRS source recovery
on:
  workflow_dispatch:
  push:
    branches: [research/lamost-dr9-source-repair-20261012]
permissions:
  contents: read
jobs:
  acquire:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[acquire-lrs-catalog]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline integrity tests
        run: python -m unittest tests.test_lamost_repair -v
      - name: Explicitly acquire one official LRS catalog
        run: python -m scripts.repair_lamost_dr9 lamost-recovery --max-seconds 5400
      - name: Split validated original bytes into retrievable parts
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('lamost-recovery')
          record=json.loads((root/'acquisition.json').read_text())
          assert record['state']=='validated' and record['validation']['whole_file_valid']
          parts=root/'parts'; parts.mkdir()
          items=[]
          with (root/record['file']).open('rb') as f:
              index=0
              while chunk:=f.read(64*1024**2):
                  p=parts/f'catalog.fits.gz.part-{index:04d}'
                  p.write_bytes(chunk)
                  items.append({'name':p.name,'bytes':len(chunk),'sha256':hashlib.sha256(chunk).hexdigest()})
                  index+=1
          (root/'parts_manifest.json').write_text(json.dumps({'parts':items,'original':record['validation']},indent=2)+'\n')
          PY
      - name: Preserve acquisition metadata even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lamost-recovery-provenance
          retention-days: 30
          path: |
            lamost-recovery/acquisition.json
            lamost-recovery/parts_manifest.json
      - name: Preserve validated catalog part 0000
        if: ${{ success() && hashFiles('lamost-recovery/parts/catalog.fits.gz.part-0000') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: lamost-catalog-part-0000
          compression-level: 0
          retention-days: 30
          path: lamost-recovery/parts/catalog.fits.gz.part-0000
      - name: Preserve validated catalog part 0001
        if: ${{ success() && hashFiles('lamost-recovery/parts/catalog.fits.gz.part-0001') != '' }}
