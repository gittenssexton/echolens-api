name: Registry checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m scripts.import_gaia
      - run: python -m pytest -q
      - name: Replay frozen WISE pilot offline
        run: |
          python -m scripts.wise_pilot replay --output /tmp/wise-replay
          python -m scripts.wise_replay_diff reports/experiment_001b/results.json /tmp/wise-replay/results.json || true
          cmp reports/experiment_001b/results.json /tmp/wise-replay/results.json
          cmp reports/experiment_001b/observations.json /tmp/wise-replay/observations.json
      - name: Preserve actual WISE replay for deterministic comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echolens-wise-001b-replay-forensics
          retention-days: 14
          if-no-files-found: warn
          path: /tmp/wise-replay/
