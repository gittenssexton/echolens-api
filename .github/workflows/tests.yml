name: Registry checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m scripts.import_gaia
      - run: python -m pytest -q
      - name: Replay registered control-matching experiment
        run: |
          python -m scripts.control_matching --output /tmp/echolens-001a
          cmp /tmp/echolens-001a/results.json reports/experiment_001a/results.json
      - name: Run registered reference-overlap study twice, offline
        run: |
          python -m scripts.control_overlap_002a --output /tmp/echolens-002a-first
          python -m scripts.control_overlap_002a --output /tmp/echolens-002a-second
          cmp /tmp/echolens-002a-first/results.json /tmp/echolens-002a-second/results.json
      - name: Preserve derived experiment 002A outputs for scientific review
        uses: actions/upload-artifact@v4
        with:
          name: echolens-control-overlap-002a
          retention-days: 30
          if-no-files-found: error
          path: /tmp/echolens-002a-first/results.json
