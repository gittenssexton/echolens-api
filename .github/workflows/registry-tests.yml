name: Registry tests

on:
  push:
    branches:
      - feature/gaia-stellar-registry-v01
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline importer and registry tests
        run: python -m unittest discover -s tests -v
