name: Research final clean FGK original access check
on:
  push:
    branches: [research/f01-selection-bias-20261011]
    paths: [.github/workflows/galah-clean-original-access.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m scripts.galah_clean_original_access
      - uses: actions/upload-artifact@v4
        with:
          name: galah-final-fgk-native-access-evidence
          path: galah_clean_originals_access/
          retention-days: 30
