name: Research GALAH DR4 bounded target selection
on:
  push:
    branches: [research/f01-selection-bias-20261011]
    paths: [.github/workflows/galah-target-selection.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m scripts.galah_dr4_target_selection
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: galah-dr4-two-target-selection
          path: galah_target_selection/
          retention-days: 30
          if-no-files-found: warn
