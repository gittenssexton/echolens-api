name: Research GALAH original reduced access
on:
  push:
    branches: [research/f01-selection-bias-20261011]
    paths: [.github/workflows/galah-original-access.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m scripts.galah_original_access
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: galah-one-target-original-format-probe
          path: galah_original_probe/
          retention-days: 30
          if-no-files-found: warn
