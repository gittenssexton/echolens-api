name: SP01-P2B original GALAH identities and native LSF
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/sp01_p2b_identity_lsf.py
      - tests/test_sp01_p2b_identity_lsf.py
      - .github/workflows/sp01-p2b-identity-lsf.yml
  push:
    branches: [research/sp01-p2b-source-controls-20261012]
    paths:
      - scripts/sp01_p2b_identity_lsf.py
      - tests/test_sp01_p2b_identity_lsf.py
      - .github/workflows/sp01-p2b-identity-lsf.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity-lsf:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Validate identity guard with synthetic-only offline fixtures
        run: python -m unittest tests.test_sp01_p2b_identity_lsf -v
      - name: Query CDS-hosted ORIGINAL GALAH DR4 and bounded native CCDs
        run: python -m scripts.sp01_p2b_identity_lsf
      - name: Archive original provider response and full LSF access evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sp01-p2b-original-id-lsf-${{ github.run_number }}
          path: reports/sp01_p2b_identity_lsf/
          retention-days: 30
          if-no-files-found: error
